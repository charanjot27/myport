name: Desktop app

# Builds JOTR Desktop for Mac and Windows, and JOTR for Android, and attaches them to a GitHub Release.
# Release: bump "version" in apps/desktop/package.json, then push a tag:  git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
# The website's download buttons point at the latest release's files.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile --filter "@promptsense/desktop..."
      - run: pnpm --filter @promptsense/desktop test
      - name: Build the installer
        working-directory: apps/desktop
        run: node build.mjs --minify && pnpm exec electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: gradle }
      - name: Signing key (optional)
        # Add these repository secrets to sign with your own key, so phones can update in place:
        # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jotr.jks"
          echo "JOTR_KEYSTORE=$RUNNER_TEMP/jotr.jks" >> "$GITHUB_ENV"
      - name: Test and build the APK
        working-directory: apps/android
        env:
          JOTR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JOTR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JOTR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export JOTR_VERSION="${GITHUB_REF_NAME#desktop-v}"
          case "$JOTR_VERSION" in [0-9]*) ;; *) export JOTR_VERSION=0.1.0 ;; esac
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease
          mkdir -p ../../out && cp app/build/outputs/apk/release/app-release.apk ../../out/JOTR-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/JOTR-android.apk

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: files, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          name: JOTR Desktop ${{ github.ref_name }}
          files: files/*
          make_latest: true
          body: |
            **Mac (easiest):** paste into Terminal: `curl -fsSL https://jotr1.netlify.app/install.sh | sh`
            Or download JOTR-mac-arm64.dmg (Apple Silicon) / JOTR-mac-x64.dmg (Intel). If macOS says JOTR is damaged (it isn't signed yet), drag it to Applications and run once in Terminal: `xattr -dr com.apple.quarantine /Applications/JOTR.app`
            **Windows:** JOTR-windows-x64.exe
            **Android:** JOTR-android.apk (open it on your phone, allow "Install unknown apps" once). It floats your script in a notch over any app.
