<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>JOTR</title>
    <style>
      :root {
        color-scheme: dark;
        --ember: linear-gradient(120deg, #ff4d6d, #ff8a3d 55%, #ffc93c);
      }
      body {
        font: 14px/1.45 -apple-system, "Segoe UI", system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        width: 310px;
        background: #0e0910;
        color: #f7efea;
      }
      header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      header b { font-size: 17px; letter-spacing: -0.02em; }
      .status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #9fe8c9; }
      .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #2ee6a6; box-shadow: 0 0 8px #2ee6a6; }
      #open {
        width: 100%; padding: 11px 14px; border: 0; border-radius: 999px; cursor: pointer;
        background: var(--ember); color: #1b1016; font: 700 14px/1 inherit; margin-bottom: 16px;
      }
      #open:hover { filter: brightness(1.06); }
      h2 { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #a8969c; margin: 0 0 6px; }
      label { display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-top: 1px solid #ffffff12; }
      input[type="checkbox"] { margin-top: 3px; accent-color: #ff8a3d; }
      small { color: #a8969c; display: block; }
      input[type="range"] { width: 100%; accent-color: #ff8a3d; }
      p { color: #a8969c; font-size: 12px; margin: 12px 0 0; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/48.png" width="26" height="26" alt="" />
      <b>JOTR</b>
      <span class="status">Active</span>
    </header>
    <button id="open" type="button">Open the teleprompter</button>
    <h2>In video calls</h2>
    <form id="settings">
      <label><input type="checkbox" name="enabled" /> <span>Process my camera in calls<small>On supported web video call sites.</small></span></label>
      <label><input type="checkbox" name="shield" /> <span>Corneal shield<small>Blur the reflection of your screen in your eyes.</small></span></label>
      <label><input type="checkbox" name="eyeContact" /> <span>Eye contact while reading<small>Only while you read; glances and pauses stay natural.</small></span></label>
      <label style="display:block">Eye-contact strength <input type="range" name="strength" min="3" max="15" step="1" /></label>
    </form>
    <p>Changes apply to new calls. Video is processed on this computer and never uploaded.</p>
    <script src="popup.js"></script>
  </body>
</html>
