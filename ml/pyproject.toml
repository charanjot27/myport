[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "promptsense-ml"
version = "0.1.0"
description = "Training pipeline for the PromptSense stumble predictor (eye-voice span GRU)."
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.3", "onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
promptsense-train = "promptsense_ml.train:main"
promptsense-eval = "promptsense_ml.evaluate:main"
promptsense-synth = "promptsense_ml.synth:main"

[tool.setuptools]
packages = ["promptsense_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
