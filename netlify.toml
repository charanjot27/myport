# Netlify: the static web app plus the user counter (a function backed by Netlify Blobs).
# The full API (accounts, sync, cloud speech) is a separate Node server and is not run on Netlify.

[build]
  # Also publishes the Chrome Web Store upload zip at /downloads/jotr-chrome-web-store.zip.
  command = "pnpm --filter @promptsense/web build && pnpm --filter @promptsense/extension package && cp apps/extension/jotr-chrome-web-store.zip apps/web/dist/downloads/"
  publish = "apps/web/dist"

[build.environment]
  # The website doesn't need the desktop app: skip it (and Electron's ~100 MB download) when installing.
  PNPM_FLAGS = "--filter=!@promptsense/desktop"
  ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
  NODE_VERSION = "22"
  # The counter lives at /api/stats on this site (see netlify/functions/stats.mjs).
  VITE_COUNTER_URL = "/api"
  # The extension download on the site is built for this address.
  JOTR_SITE_ORIGIN = "https://jotr1.netlify.app"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The counter: GET /api/stats and POST /api/stats/hello both go to the function.
[[redirects]]
  from = "/api/stats"
  to = "/.netlify/functions/stats"
  status = 200
  force = true

[[redirects]]
  from = "/api/stats/*"
  to = "/.netlify/functions/stats"
  status = 200
  force = true

# Single-page app: every other path is served by index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
